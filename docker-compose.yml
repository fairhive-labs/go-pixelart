services:
  pixelart:
    build: .
    image: fairhivelabs/pixelart
    container_name: pixelart
    ports:
      - 8080:8080
    environment:
      # see the README for the full list, these are the defaults
      MAX_UPLOAD_BYTES: 10485760
      MAX_PIXELS: 40000000
    read_only: true
    tmpfs:
      # uploads larger than MaxMultipartMemory are spooled to temporary files
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
