name: Unit Test
on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: "['1.25.x']"
      os:
        required: false
        type: string
        default: "['ubuntu-latest']"

permissions:
  contents: read

jobs:
  unit-test:
    strategy:
      matrix:
        go-version: ${{ fromJson(inputs.go-version) }}
        os: ${{ fromJson(inputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        shell: bash
      - name: test
        run: go test -race -v ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25.x"
