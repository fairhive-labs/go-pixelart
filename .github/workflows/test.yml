name: Unit Test
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: test
        run: go test -race -v ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25.x"
