on:
  push:
    branches:
      - main

permissions:
  contents: read

name: Test & Heroku Deployment
jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
  heroku:
    runs-on: ubuntu-latest
    needs: test
    env:
      # step conditions cannot read the secrets context, only env
      HEROKU_CONFIGURED: ${{ secrets.HEROKU_API_KEY != '' }}
      SLACK_CONFIGURED: ${{ secrets.SLACK_WEBHOOK != '' }}
      # set the HEROKU_APP_NAME / HEROKU_EMAIL repository variables to deploy
      # somewhere else, the health check URL follows the app name
      APP_NAME: ${{ vars.HEROKU_APP_NAME || 'fairhive-pixelart' }}
    steps:
      - uses: actions/checkout@v7
      - name: Skipping deployment
        if: ${{ env.HEROKU_CONFIGURED != 'true' }}
        run: echo "::notice::HEROKU_API_KEY is not configured, skipping the Heroku deployment"
      # the Heroku CLI is no longer preinstalled on the GitHub runners, and
      # heroku-deploy shells out to it: without this the deploy step dies with
      # "/bin/sh: 1: heroku: not found"
      - name: Install the Heroku CLI
        if: ${{ env.HEROKU_CONFIGURED == 'true' }}
        run: |
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku --version
      - name: Deploy
        if: ${{ env.HEROKU_CONFIGURED == 'true' }}
        uses: akhileshns/heroku-deploy@v3.15.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ env.APP_NAME }}
          heroku_email: ${{ vars.HEROKU_EMAIL || 'jsie@fairhive-labs.com' }}
          usedocker: true
          healthcheck: "https://${{ env.APP_NAME }}.herokuapp.com/health"
          checkstring: "ok"
          delay: 5
          rollbackonhealthcheckfailed: true
      - name: Slack Notification
        if: ${{ always() && env.HEROKU_CONFIGURED == 'true' && env.SLACK_CONFIGURED == 'true' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: _github
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: "https://${{ env.APP_NAME }}.herokuapp.com/"
          SLACK_TITLE: Heroku Deployment - ${{ vars.PROJECT_NAME }}
          SLACK_USERNAME: _whyvrafvr
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_FOOTER: sha-${{ github.sha }}
